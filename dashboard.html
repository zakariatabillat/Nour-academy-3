<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashborad</title>
    <link rel="stylesheet" href="/css/input.css">
    <link rel="stylesheet" href="css/index.css">
    <script src="/js/students.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

</head>

<body>
    <main class="flex ">


        <section id="side-bar" class="h-screen bg-blue-800 w-1/6 rounded-[10px] fixed">

            <div class="flex mt-10 gap-3 bg-white h-20 items-center border-solid border-2 border-black rounded-[10px]">
                <i class="fa-solid fa-user-graduate fa-2xl mt-2.5" style="color:rgb(116, 192, 252);"></i>
                <p class="font-bold text-xl">Total des inscriptions</p>
            </div>
            <div class="flex mt-10  gap-3 bg-white h-20 items-center border-solid border-2 border-black rounded-[10px]">
                <i class="fa-solid fa-user-plus fa-xl mt-2.5" style="color: rgb(116, 192, 252);"></i>
                <p class="font-bold text-xl">Nouvelle inscription</p>
            </div>
            <div class="flex mt-10  gap-3 bg-white h-20 items-center border-solid border-2 border-black rounded-[10px]">
                <i class="fa-regular fa-circle-check fa-xl" style="color: rgb(116, 192, 252);"></i>
                <p class="font-bold text-xl "> Validées</p>
            </div>
            <div class="flex mt-10  gap-3 bg-white h-20 items-center border-solid border-2 border-black rounded-[10px]">
                <i class="fa-solid fa-hourglass-start fa-xl" style="color: rgb(116, 192, 252);"></i>
                <p class="font-bold text-xl "> En attente</p>
            </div>
        </section>
        <section id="students-list" class="ml-70">
          





        </section>
    </main>
</body>

</html>
