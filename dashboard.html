<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashborad</title>
    <link rel="stylesheet" href="/css/input.css">
    <link rel="stylesheet" href="css/index.css">
    <script src="/js/students.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body class="bg-slate-50 font-['Outfit']">

    <main class="flex">

        <section id="side-bar"
            class="h-screen bg-blue-900 w-1/6 rounded-r-2xl fixed p-4 shadow-lg">

            <div
                class="flex mt-10 gap-3 bg-white h-20 items-center border border-blue-100 rounded-xl px-3 shadow-sm">
                <i class="fa-solid fa-user-graduate fa-2xl mt-2.5"
                    style="color:#2563eb;"></i>
                <p class="font-bold text-xl text-blue-900">Total des inscriptions</p>
            </div>

            <div
                class="flex mt-10 gap-3 bg-blue-800 h-20 items-center border border-blue-700 rounded-xl px-3">
                <i class="fa-solid fa-user-plus fa-xl mt-2.5"
                    style="color:#93c5fd;"></i>
                <p class="font-bold text-xl text-white">Nouvelle inscription</p>
            </div>

            <div
                class="flex mt-10 gap-3 bg-blue-800 h-20 items-center border border-blue-700 rounded-xl px-3">
                <i class="fa-regular fa-circle-check fa-xl"
                    style="color:#93c5fd;"></i>
                <p class="font-bold text-xl text-white">Validées</p>
            </div>

            <div
                class="flex mt-10 gap-3 bg-blue-800 h-20 items-center border border-blue-700 rounded-xl px-3">
                <i class="fa-solid fa-hourglass-start fa-xl"
                    style="color:#93c5fd;"></i>
                <p class="font-bold text-xl text-white">En attente</p>
            </div>

        </section>

        <section id="students-list" class="ml-70">

        </section>
        
<section id="edit-form" class=" hidden fixed inset-0 z-50 bg-slate-900/40 flex items-start justify-center overflow-y-auto p-4">

    <div class="bg-white w-full max-w-2xl my-6 rounded-2xl shadow-xl border border-blue-100 p-6">

        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-bold text-blue-900">Modifier l'inscription</h2>
                <p class="text-slate-500 mt-1">Modifiez les informations du dossier</p>
            </div>

            <button type="button" id="cancel-edit"
                class="text-slate-500 text-2xl px-2" aria-label="Fermer">
            </button>
        </div>

        <form id="student-edit-form" class="flex flex-col gap-5">

            <div>
                <h3 class="font-bold text-blue-800 border-b pb-2 mb-4">
                    Informations de l'élève
                </h3>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                    <div>
                        <label for="eleve-nom" class="block mb-1 text-sm font-medium">Nom</label>
                        <input id="eleve-nom" name="eleveNom" type="text"
                            class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500">
                    </div>

                    <div>
                        <label for="eleve-prenom" class="block mb-1 text-sm font-medium">Prénom</label>
                        <input id="eleve-prenom" name="elevePrenom" type="text"
                            class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500">
                    </div>

                    <div class="sm:col-span-2">
                        <label for="eleve-niveau" class="block mb-1 text-sm font-medium">Niveau scolaire</label>
                        <select id="eleve-niveau" name="eleveNiveau"
                            class="w-full border border-slate-300 rounded-lg p-3 bg-white outline-none focus:border-blue-500">
                            <option value="">Choisir un niveau</option>
                            <option value="1e année primaire">1e année primaire</option>
                            <option value="2e année primaire">2e année primaire</option>
                            <option value="3e année primaire">3e année primaire</option>
                            <option value="4e année primaire">4e année primaire</option>
                            <option value="5e année primaire">5e année primaire</option>
                            <option value="6e année primaire">6e année primaire</option>
                            <option value="1e année collège">1e année collège</option>
                            <option value="2e année collège">2e année collège</option>
                            <option value="3e année collège">3e année collège</option>
                            <option value="1e année bac">1e année bac</option>
                            <option value="2e année bac">2e année bac</option>
                        </select>
                    </div>

                </div>
            </div>

            <div>
                <h3 class="font-bold text-blue-800 border-b pb-2 mb-4">
                    Détails de l'inscription
                </h3>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                    <div>
                        <label for="inscription-matiere" class="block mb-1 text-sm font-medium">Matière</label>
                        <select id="inscription-matiere" name="matiere"
                            class="w-full border border-slate-300 rounded-lg p-3 bg-white outline-none focus:border-blue-500">
                            <option value="">Choisir une matière</option>
                            <option value="Arabe">Arabe</option>
                            <option value="Français">Français</option>
                            <option value="Anglais">Anglais</option>
                            <option value="Mathématiques">Mathématiques</option>
                            <option value="Sciences de la Vie et de la Terre (SVT)">Sciences de la Vie et de la Terre (SVT)</option>
                            <option value="Physique-Chimie">Physique-Chimie</option>
                            <option value="Histoire-Géographie">Histoire-Géographie</option>
                            <option value="Éducation islamique">Éducation islamique</option>
                            <option value="Informatique">Informatique</option>
                            <option value="Philosophie">Philosophie</option>
                        </select>
                    </div>

                    <div>
                        <label for="inscription-centre" class="block mb-1 text-sm font-medium">Centre</label>
                        <select id="inscription-centre" name="centre"
                            class="w-full border border-slate-300 rounded-lg p-3 bg-white outline-none focus:border-blue-500">
                            <option value="">Choisir un centre</option>
                            <option value="Nador Centre">Nador Centre</option>
                            <option value="Hay Al Matar">Hay Al Matar</option>
                            <option value="Selouane">Selouane</option>
                        </select>
                    </div>

                    <div class="sm:col-span-2">
                        <label for="inscription-statut" class="block mb-1 text-sm font-medium">Statut du dossier</label>
                        <select id="inscription-statut" name="statut"
                            class="w-full border border-slate-300 rounded-lg p-3 bg-white outline-none focus:border-blue-500">
                            <option value="En attente">En attente</option>
                            <option value="Validée">Validée</option>
                            <option value="Refusée">Refusée</option>
                        </select>
                    </div>

                </div>
            </div>

            <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 pt-4 border-t">

                <button type="button" id="cancel-edit-bottom"
                    class="px-5 py-3 rounded-lg bg-slate-100 text-slate-700 font-semibold">
                    Annuler
                </button>

                <button type="submit"
                    class="px-5 py-3 rounded-lg bg-blue-700 text-white font-semibold">
                    Enregistrer les modifications
                </button>

            </div>

        </form>
    </div>
</section>


    </main>

</body>

</html>
